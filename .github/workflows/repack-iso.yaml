name: Repack Harvester ISO on backport branches

on:
  push:
    branches:
    - 'backport-*'

jobs:
  repack-iso:
    runs-on: ubuntu-latest

    steps:
    - name: Parse fork version
      run: |
        branch_name="${{ github.ref_name }}"
        version="${branch_name#backport-}"
        echo "HARVESTER_VERSION=$version" >> $GITHUB_ENV

    - name: Checkout
      uses: actions/checkout@v4

    - name: Repack ISO
      run: |
        make repack-iso

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Upload ISO to S3
      run: |
        aws s3 cp dist/*.iso s3://${{ secrets.S3_DESTINATION }} --acl public-read

    - name: Upload ISO artifact
      uses: actions/upload-artifact@v4
      with:
        name: harvester-iso-repacked
        path: dist/*.iso
